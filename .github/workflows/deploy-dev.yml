name: Deploy DEV

on:
  workflow_dispatch:
    inputs:
      run_e2e:
        description: Run the E2E pipeline after deployment
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: databricks-dev
  cancel-in-progress: false

jobs:
  validate_deploy:
    name: Validate and deploy bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dev

    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@v1.10.0
        with:
          version: "1.10.0"

      - name: Validate bundle
        run: databricks bundle validate -t dev

      - name: Deploy bundle
        run: databricks bundle deploy -t dev

      - name: Run E2E pipeline
        if: ${{ inputs.run_e2e }}
        run: databricks bundle run e2e_pipeline_job -t dev
