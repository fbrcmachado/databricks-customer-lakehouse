resources:
  jobs:
    gold_bi_job:
      name: customer-lakehouse-gold-bi
      queue:
        enabled: true
      max_concurrent_runs: 1

      tasks:
        - task_key: gold_bi
          notebook_task:
            notebook_path: ../notebooks/04_gold_bi.py
            base_parameters:
              catalog: ${var.catalog}
          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - "pyyaml==6.0.2"
