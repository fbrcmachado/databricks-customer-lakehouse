resources:
  jobs:
    governance_job:
      name: customer-lakehouse-governance-as-code
      queue:
        enabled: true
      max_concurrent_runs: 1

      tasks:
        - task_key: governance
          notebook_task:
            notebook_path: ../notebooks/06_governance_as_code.py
            base_parameters:
              catalog: ${var.catalog}
          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - "pyyaml==6.0.2"
