resources:
  jobs:
    gold_ml_job:
      name: customer-lakehouse-gold-ml
      queue:
        enabled: true
      max_concurrent_runs: 1

      tasks:
        - task_key: gold_ml
          notebook_task:
            notebook_path: ../notebooks/05_gold_ml.py
            base_parameters:
              catalog: ${var.catalog}
          environment_key: ml

      environments:
        - environment_key: ml
          spec:
            environment_version: "5"
