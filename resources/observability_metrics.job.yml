resources:
  jobs:
    observability_metrics_job:
      name: customer-lakehouse-observability-metrics
      queue:
        enabled: true

      tasks:
        - task_key: observability_metrics
          notebook_task:
            notebook_path: ../notebooks/03_observability_metrics.py
            base_parameters:
              catalog: ${var.catalog}
          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - "pyyaml==6.0.2"
